<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>D · Fusion — Journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113}a:hover{color:#3A3A3F}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px; background: #F5F5F2; color: #111113; font-family: 'Geist', 'Inter', system-ui, sans-serif; font-feature-settings: 'tnum' 1; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <span style="font-size: 26px; font-weight: 600; letter-spacing: -0.6px">Journal</span>
    <button aria-label="Rechercher" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; color: #111113; display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z M21 21l-4.3-4.3"></path></svg></button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; height: 48px; padding: 0 4px">
    <button aria-label="Mois précédent" style="width: 44px; height: 44px; border: 0; background: transparent; color: #6E6E73; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <span style="font-size: 15px; font-weight: 600">Novembre 2026</span>
    <button aria-label="Mois suivant" style="width: 44px; height: 44px; border: 0; background: transparent; color: #6E6E73; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: #6E6E73">Entrées</span>
      <span style="font-size: 16px; font-weight: 600; color: #0E7A4F">+350 000</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #E6E6E1; padding-left: 14px">
      <span style="font-size: 12px; color: #6E6E73">Dépenses</span>
      <span style="font-size: 16px; font-weight: 600">−186 500</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #E6E6E1; padding-left: 14px">
      <span style="font-size: 12px; color: #6E6E73">Solde</span>
      <span style="font-size: 16px; font-weight: 600">163 500</span>
    </div>
  </div>

  <div style="display: flex; gap: 8px">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
      <button onClick="{{ f.pick }}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{ f.bd }}; background: {{ f.bg }}; color: {{ f.fg }}; font-size: 13px; font-weight: 600">{{ f.label }}</button>
    </sc-for>
    <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #E6E6E1; background: #FFFFFF; color: #3A3A3F; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; margin-left: auto">Filtres<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{ days }}" as="day" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: #6E6E73; padding-bottom: 2px">
          <span>{{ day.label }}</span><span>{{ day.total }}</span>
        </div>
        <sc-for list="{{ day.rows }}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; height: 54px">
            <div style="width: 38px; height: 38px; border-radius: 11px; background: {{ r.tint }}; display: flex; align-items: center; justify-content: center; color: {{ r.ic }}; flex: none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.d }}"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 15px; font-weight: 500">{{ r.title }}</span>
              <span style="font-size: 12px; color: #6E6E73">{{ r.sub }}</span>
            </div>
            <span style="font-size: 15px; font-weight: 600; color: {{ r.color }}">{{ r.amount }}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 0; background: #F5F5F2; border-top: 1px solid #E6E6E1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start">
    <a href="D-Accueil.dc.html" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6E6E73; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7 M5 10v10h14V10"></path></svg>Accueil</a>
    <a href="D-Journal.dc.html" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #111113; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01"></path></svg>Journal</a>
    <button onClick="{{ openSheet }}" aria-label="Ajouter une dépense ou une entrée" style="justify-self: center; width: 56px; height: 46px; border: 0; border-radius: 16px; background: #111113; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
    </button>
    <a href="D-Analyse.dc.html" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6E6E73; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"></path></svg>Analyse</a>
    <a href="D-Accueil.dc.html" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6E6E73; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8 M16 5v4 M10 15v4"></path></svg>Réglages</a>
  </nav>

  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(17,17,19,0.4); display: flex; flex-direction: column">
      <button onClick="{{ closeSheet }}" aria-label="Fermer" style="flex: 1; border: 0; background: transparent"></button>
      <div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 40px; display: flex; flex-direction: column; gap: 10px">
        <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D6D6D0; margin-bottom: 8px"></div>
        <span style="font-size: 17px; font-weight: 600; padding-bottom: 4px">Nouvelle opération</span>
        <a href="D-Saisie.dc.html" style="display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 16px; border-radius: 18px; background: #F5F5F2; text-decoration: none; color: #111113">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: #111113; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 16px; font-weight: 600">Dépense</span><span style="font-size: 13px; color: #6E6E73">Repas, transport, data, famille…</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
        <a href="D-Saisie.dc.html" style="display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 16px; border-radius: 18px; background: #F5F5F2; text-decoration: none; color: #111113">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: #0E7A4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 16px; font-weight: 600">Entrée</span><span style="font-size: 13px; color: #6E6E73">Salaire, freelance, don reçu…</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var IC = {
  food: 'M4 11h16a8 8 0 0 1-16 0Z M9 7c0-1.5 1-2.5 2-3 M13 7c0-1.5 1-2.5 2-3',
  car: 'M5 17V12l2-5h10l2 5v5 M3 17h18 M7 20v-3 M17 20v-3 M7.5 14h.01 M16.5 14h.01',
  wifi: 'M2 9a15 15 0 0 1 20 0 M5 12.5a10 10 0 0 1 14 0 M8.5 16a5 5 0 0 1 7 0 M12 19.5h.01',
  family: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M2 21v-1a6 6 0 0 1 12 0v1 M16 3.5a4 4 0 0 1 0 7.5 M22 21v-1a6 6 0 0 0-4-5.6',
  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z',
  trend: 'M3 17l6-6 4 4 8-8 M14 7h7v7',
  save: 'M19 9c-1-3-4-5-8-5-5 0-8 3-8 7 0 2 1 4 3 5v3h3v-2h4v2h3v-3c1-.6 2-1.5 2.5-2.5H21v-4h-2Z M15 9h.01'
};
var DATA = [
  { label: "Aujourd'hui · mar. 24 nov.", rows: [['food','Déjeuner','Alimentation · Espèces',-2500],['car','Taxi','Transport · Espèces',-1000]] },
  { label: 'Hier · lun. 23 nov.', rows: [['wifi','Forfait internet','Data & Télécom · Mobile money',-5000],['food','Courses du marché','Alimentation · Espèces',-6500]] },
  { label: 'ven. 20 nov.', rows: [['moon','Sadaqa du vendredi','Sadaqa & Deen · Espèces',-2000],['family','Envoi à la famille','Famille · Banque',-50000]] },
  { label: 'dim. 1er nov.', rows: [['trend','Salaire','Entrée · Banque',350000],['save','Virement au coffre','Épargne · Coffre',-100000]] }
];
function fmt(n){ var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (n < 0 ? '−' : '+') + s; }
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { f: 'all', sheet: false }; }
  renderVals(){
    var self = this, f = this.state.f;
    var filters = [['all','Tout'],['out','Dépenses'],['in','Entrées']].map(function(x){
      var on = x[0] === f;
      return { label: x[1], bg: on ? '#111113' : '#FFFFFF', fg: on ? '#FFFFFF' : '#3A3A3F', bd: on ? '#111113' : '#E6E6E1', pick: function(){ self.setState({ f: x[0] }); } };
    });
    var days = [];
    DATA.forEach(function(d){
      var rows = d.rows.filter(function(r){ return f === 'all' || (f === 'in' ? r[3] > 0 : r[3] < 0); });
      if (!rows.length) return;
      var tot = rows.reduce(function(a, r){ return a + r[3]; }, 0);
      days.push({ label: d.label, total: fmt(tot), rows: rows.map(function(r){
        var inc = r[3] > 0;
        return { d: IC[r[0]], title: r[1], sub: r[2], amount: fmt(r[3]), color: inc ? '#0E7A4F' : '#111113', tint: inc ? '#DDEFE5' : '#EAEAE5', ic: inc ? '#0E7A4F' : '#111113' };
      }) });
    });
    return { filters: filters, days: days, sheet: this.state.sheet, openSheet: function(){ self.setState({ sheet: true }); }, closeSheet: function(){ self.setState({ sheet: false }); } };
  }
}
</script>
</body>
</html>
