<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>D · Fusion — Saisie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113}a:hover{color:#3A3A3F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 58px 16px 28px; display: flex; flex-direction: column; gap: 12px; background: #F5F5F2; color: #111113; font-family: 'Geist', 'Inter', system-ui, sans-serif; font-feature-settings: 'tnum' 1; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="D-Accueil.dc.html" aria-label="Fermer" style="width: 40px; height: 40px; border-radius: 20px; background: #EAEAE5; display: flex; align-items: center; justify-content: center; color: #111113">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18 M6 6l12 12"></path></svg>
    </a>
    <div style="display: flex; padding: 3px; border-radius: 12px; background: #EAEAE5">
      <button onClick="{{ setDep }}" style="width: 96px; height: 34px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: {{ depBg }}; color: {{ depFg }}; box-shadow: {{ depShadow }}">Dépense</button>
      <button onClick="{{ setInc }}" style="width: 96px; height: 34px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: {{ incBg }}; color: {{ incFg }}; box-shadow: {{ incShadow }}">Entrée</button>
    </div>
    <button aria-label="Date : aujourd'hui" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #EAEAE5; display: flex; align-items: center; justify-content: center; color: #111113">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4Z M4 10h16 M9 3v4 M15 3v4"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 18px; font-weight: 500; color: {{ signColor }}">{{ sign }}</span>
      <span style="font-size: 60px; font-weight: 600; letter-spacing: -2.6px; line-height: 1; color: {{ amtColor }}">{{ amount }}</span>
      <span style="font-size: 17px; font-weight: 500; color: #6E6E73">FCFA</span>
    </div>
    <span style="font-size: 13px; color: #6E6E73">{{ catName }} · il te restera <strong style="color: #0E7A4F; font-weight: 600">{{ remaining }}</strong></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="12">
      <button onClick="{{ c.pick }}" style="height: 62px; border-radius: 16px; border: 1.5px solid {{ c.bd }}; background: {{ c.bg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0 4px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ c.color }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.d }}"></path></svg>
        <span style="font-size: 11px; font-weight: {{ c.w }}; color: {{ c.lbl }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{ c.short }}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 6px; align-items: center">
    <sc-for list="{{ accts }}" as="a" hint-placeholder-count="4">
      <button onClick="{{ a.pick }}" style="flex: 1; height: 38px; border-radius: 12px; border: 1px solid {{ a.bd }}; background: {{ a.bg }}; color: {{ a.fg }}; font-size: 12px; font-weight: 600; white-space: nowrap; padding: 0 2px">{{ a.name }}</button>
    </sc-for>
    <button aria-label="Ajouter une note" style="width: 38px; height: 38px; flex: none; border-radius: 12px; border: 1px solid #E0E0DA; background: transparent; color: #6E6E73; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z M13 7l4 4"></path></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: auto">
    <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
      <button onClick="{{ k.press }}" aria-label="{{ k.aria }}" style="height: 50px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 0 #E0E0DA; color: #111113; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{ k.isTxt }}" hint-placeholder-val="{{ true }}">{{ k.label }}</sc-if>
        <sc-if value="{{ k.isDel }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z M17 9l-6 6 M11 9l6 6"></path></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <button onClick="{{ save }}" style="height: 56px; border: 0; border-radius: 16px; background: {{ ctaBg }}; color: {{ ctaFg }}; font-size: 16px; font-weight: 600">{{ ctaLabel }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var IC = {
  food: 'M4 11h16a8 8 0 0 1-16 0Z M9 7c0-1.5 1-2.5 2-3 M13 7c0-1.5 1-2.5 2-3',
  car: 'M5 17V12l2-5h10l2 5v5 M3 17h18 M7 20v-3 M17 20v-3 M7.5 14h.01 M16.5 14h.01',
  wifi: 'M2 9a15 15 0 0 1 20 0 M5 12.5a10 10 0 0 1 14 0 M8.5 16a5 5 0 0 1 7 0 M12 19.5h.01',
  home: 'M3 11l9-7 9 7 M5 10v10h14V10 M10 20v-5h4v5',
  family: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M2 21v-1a6 6 0 0 1 12 0v1 M16 3.5a4 4 0 0 1 0 7.5 M22 21v-1a6 6 0 0 0-4-5.6',
  save: 'M19 9c-1-3-4-5-8-5-5 0-8 3-8 7 0 2 1 4 3 5v3h3v-2h4v2h3v-3c1-.6 2-1.5 2.5-2.5H21v-4h-2Z M15 9h.01',
  trend: 'M3 17l6-6 4 4 8-8 M14 7h7v7',
  book: 'M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2Z M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8Z',
  heart: 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z',
  shirt: 'M8 3 4 5 2 10l3 1v10h14V11l3-1-2-5-4-2a4 4 0 0 1-8 0Z',
  moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z',
  dots: 'M5 12h.01 M12 12h.01 M19 12h.01',
  laptop: 'M4 5h16v10H4Z M2 19h20',
  gift: 'M3 8h18v4H3Z M5 12v9h14v-9 M12 8v13 M12 8c-2-4-6-4-6-1s6 1 6 1Zm0 0c2-4 6-4 6-1s-6 1-6 1Z'
};
var CATS = [
  ['food','Alimentation','Repas','food','#B45309','#FDF1DF'],['car','Transport','Transport','car','#2F5BD3','#E6EDFB'],['data','Data & Télécom','Data','wifi','#7C4DCC','#F0E9FB'],['home','Loyer & charges','Logement','home','#C2410C','#FCEAE2'],
  ['fam','Famille','Famille','family','#BE3A78','#FBE7F0'],['sav','Épargne','Épargne','save','#0E7A4F','#E0F1E8'],['proj','Projets','Projets','trend','#0F766E','#DEF2EF'],['learn','Formation','Formation','book','#1D4ED8','#E4ECFC'],
  ['health','Santé','Santé','heart','#BE123C','#FBE4E9'],['cloth','Vêtements','Habits','shirt','#A16207','#FBF1D9'],['deen','Sadaqa & Deen','Sadaqa','moon','#8A6A2F','#F3ECDF'],['misc','Divers','Divers','dots','#5F5F66','#ECECE8']
];
var INC = [
  ['sal','Salaire','Salaire','trend','#0E7A4F','#E0F1E8'],['free','Freelance','Freelance','laptop','#2F5BD3','#E6EDFB'],['gift','Don reçu','Don reçu','gift','#BE3A78','#FBE7F0'],['other','Autre entrée','Autre','dots','#5F5F66','#ECECE8']
];
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { amt: '2500', type: 'dep', cat: 'food', icat: 'sal', acct: 'cash' }; }
  press(k){
    var a = this.state.amt;
    if (k === 'del') a = a.slice(0, -1);
    else if (k === '000') { if (a && a !== '0') a = a + '000'; }
    else a = (a === '0' || a === '') ? k : a + k;
    if (a.length > 9) return;
    this.setState({ amt: a });
  }
  renderVals(){
    var self = this, s = this.state;
    var n = parseInt(s.amt || '0', 10), dep = s.type === 'dep', catName = '';
    var list = dep ? CATS : INC, key = dep ? 'cat' : 'icat';
    var cats = list.map(function(c){
      var on = c[0] === s[key]; if (on) catName = c[1];
      return { short: c[2], d: IC[c[3]], color: c[4], bg: on ? c[5] : '#FFFFFF', bd: on ? c[4] : '#FFFFFF', lbl: on ? '#111113' : '#55555B', w: on ? '600' : '500', pick: function(){ var o = {}; o[key] = c[0]; self.setState(o); } };
    });
    var accts = [['bank','Banque'],['momo','Mobile money'],['cash','Espèces'],['sav','Coffre']].map(function(a){
      var on = a[0] === s.acct;
      return { name: a[1], bg: on ? '#111113' : 'transparent', fg: on ? '#FFFFFF' : '#3A3A3F', bd: on ? '#111113' : '#E0E0DA', pick: function(){ self.setState({ acct: a[0] }); } };
    });
    var keys = ['1','2','3','4','5','6','7','8','9','000','0','del'].map(function(k){
      return { label: k, isDel: k === 'del', isTxt: k !== 'del', aria: k === 'del' ? 'Effacer' : k, press: function(){ self.press(k); } };
    });
    return {
      cats: cats, accts: accts, keys: keys, catName: catName,
      amount: fmt(n), amtColor: n > 0 ? '#111113' : '#B5B5B0', sign: dep ? '−' : '+', signColor: dep ? '#6E6E73' : '#0E7A4F',
      remaining: fmt(163500 + (dep ? -n : n)),
      depBg: dep ? '#FFFFFF' : 'transparent', depFg: dep ? '#111113' : '#6E6E73', depShadow: dep ? '0 1px 2px rgba(0,0,0,.08)' : 'none',
      incBg: dep ? 'transparent' : '#FFFFFF', incFg: dep ? '#6E6E73' : '#111113', incShadow: dep ? 'none' : '0 1px 2px rgba(0,0,0,.08)',
      setDep: function(){ self.setState({ type: 'dep' }); }, setInc: function(){ self.setState({ type: 'inc' }); },
      ctaBg: n > 0 ? (dep ? '#111113' : '#0E7A4F') : '#E3E3DE', ctaFg: n > 0 ? '#FFFFFF' : '#6E6E73',
      ctaLabel: n > 0 ? 'Enregistrer ' + (dep ? '−' : '+') + fmt(n) + ' FCFA' : 'Saisis un montant',
      save: function(){ self.setState({ amt: '' }); }
    };
  }
}
</script>
</body>
</html>
